<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №7: JavaScript Promise API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #333; }
        button { margin: 5px; padding: 8px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        input { margin: 5px; padding: 5px; }
        #loader { display: none; text-align: center; color: #666; font-style: italic; margin: 10px 0; }
        #result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; min-height: 20px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Лабораторна робота №7: Використання JavaScript Promise API</h1>
    <p>Студент: Борбулевич Богдан Іванович, №2</p>

    <!-- Завдання 0: Лоадер -->
    <h2>Завдання 0: Лоадер під час очікування Promise</h2>
    <div id="loader">Завантаження... (Promise виконується)</div>
    <div id="result"></div>

    <!-- Завдання 2: checkNumber -->
    <h2>Завдання 2: checkNumber(num) з then/catch</h2>
    <input type="number" id="numInput" placeholder="Введіть число" value="15">
    <button onclick="testCheckNumber()">Тестувати checkNumber</button>
    <div id="result2"></div>

    <!-- Завдання 3: randomNumber -->
    <h2>Завдання 3: randomNumber() з then</h2>
    <button onclick="testRandomNumber()">Запустити randomNumber</button>
    <div id="result3"></div>

    <script>
        // Завдання 0: Показ/приховування лоадера
        function showLoader() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').innerHTML = ''; // Очистити результат
        }

        function hideLoader(message = '') {
            document.getElementById('loader').style.display = 'none';
            if (message) {
                document.getElementById('result').innerHTML = message;
            }
        }

        // Завдання 2: checkNumber(num)
        function checkNumber(num) {
            return new Promise((resolve, reject) => {
                showLoader(); // Показати лоадер
                setTimeout(() => { // Імітація асинхронності
                    if (num > 10) {
                        resolve("Число більше 10"); // Успіх
                    } else {
                        reject("Число менше або дорівнює 10"); // Помилка
                    }
                }, 1000); // Затримка 1 сек
            });
        }

        function testCheckNumber() {
            const num = parseInt(document.getElementById('numInput').value) || 0;
            checkNumber(num)
                .then(result => {
                    hideLoader(`<span class="success">Успіх: ${result}</span>`);
                })
                .catch(error => {
                    hideLoader(`<span class="error">Помилка: ${error}</span>`);
                });
        }

        // Завдання 3: randomNumber()
        function randomNumber() {
            return new Promise((resolve, reject) => {
                showLoader(); // Показати лоадер
                const delay = Math.floor(Math.random() * 2000) + 1000; // 1-3 сек
                const randomNum = Math.floor(Math.random() * 100) + 1; // 1-100
                setTimeout(() => {
                    const startTime = performance.now();
                    resolve({ num: randomNum, time: delay }); // Успіх з числом і часом
                }, delay);
            });
        }

        function testRandomNumber() {
            randomNumber()
                .then(({ num, time }) => {
                    const endTime = performance.now();
                    const actualTime = ((endTime - performance.now()) / 1000).toFixed(2); // Час виконання
                    hideLoader(`<span class="success">Число: ${num}, Затримка: ${time} мс, Фактичний час: ${actualTime} сек</span>`);
                })
                .catch(error => {
                    hideLoader(`<span class="error">Помилка: ${error}</span>`);
                });
        }
    </script>
</body>
</html>
